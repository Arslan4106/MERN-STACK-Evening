<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess My Number</title>
    <link rel="stylesheet" href="style.css" class="css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <h2>Game</h2>
      </div>
      <div class="menu">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About Us</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Projects</a></li>
          <li><a href="#">Contact Us</a></li>
          <li><a href="#">Blogs</a></li>
        </ul>
      </div>
      <div class="">
        <button class="btnss">Login</button>
        <button class="btnss">SignUp</button>
      </div>
    </header>
    <main>
      <button class="again btn">Again!</button>
      <h2>Guess My Number</h2>
      <p class = "between">(Between 1 & 20)</p>
    </main>
    <hr />
    <div class="secretNumber">?</div>
    <div class="content">
      <div class="leftContent">
        <input type="number" class = "guess" /> <br><br>
        <button class="check btn">Check</button>
      </div>
      <div class="rightContent">
        <p class="message">Start Guessing....</p>
        <p class="score-Label">Score: <span class="score">20</span></p>
        <p class="highestScore-Label">HighestScore: <span class="highestScore">0</span></p>
    </div>
  </body>
  <script src="script.js"></script>
</html>
