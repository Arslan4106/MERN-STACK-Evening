<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess My Number</title>
    <link rel="stylesheet" href="style.css" class="css" />
  </head>
  <body>
    <header>
      <button class="again btn">Again!</button>
      <h2>Guess My Number</h2>
      <p class="between">(Between 1 & 20)</p>
    </header>
    <div class="secretNumber">?</div>
    <hr />
    <div class="content">
      <div class="leftContent">
        <input type="number" class="number" /> <br />
        <button class="guess btn">Check</button>
      </div>
      <div class="rightContent">
        <h2 class="message">Start Guessing....</h2>
        <p class="score-label">Score: <span class="score">20</span></p>
        <p class="heighestScore-Label">
          Highest Score: <span class="highestScore">0</span>
        </p>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
