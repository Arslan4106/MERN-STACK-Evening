<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" class="css" />
  </head>
  <body>
    <div class="main">
      <div class="player--0 player player--active">
        <h2 class="heading">Player 1</h2>
        <p class="score" id="score--0">43</p>
        <div class="current">
          <p>current</p>
          <p id="current--0">0</p>
        </div>
      </div>
      <div class="player--1 player">
        <h2 class="heading">Player 2</h2>
        <p class="score" id="score--1">21</p>
        <div class="current">
          <p>current</p>
          <p id="current--1">0</p>
        </div>
      </div>
      <button class="start-Game btn">🤝 Reset Game</button>
      <button class="rolldice btn">🎲 Roll Dice</button>
      <button class="hold btn">🤘Hold</button>
      <img src="dice-5.png" class="dice hidden" alt="" height="80" width="80" />
    </div>
  </body>
  <script src="script.js"></script>
</html>
